name: Backend Docker Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build-push-ecr-dev.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build-push-ecr-dev.yml"

env: 
  AWS_REGION: ca-central-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  ECR: ${{ secrets.DEV_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com/gc-signin-dev-backend-api
  GITHUB_SHA: ${{ github.sha }}
  TAG_VERSION: ${{ github.ref_name }}

permissions:
  id-token: write
  contents: write
  
jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@main
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
        DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}

    # - name: Setup QEMU
    #   uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
  
    # - name: Setup Docker Buildx
    #   uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Confirm secret is accessible
      run: |
        if [ -z "${{ secrets.DEV_AWS_ACCOUNT_ID }}" ]; then
          echo "❌ DEV_AWS_ACCOUNT_ID is not set"
          exit 1
        else
          echo "✅ DEV_AWS_ACCOUNT_ID is available"
        fi

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # TODO: Replace with a locked down IAM role
    # - name: Install AWS CLI
    #   run: |
    #       sudo apt-get update
    #       sudo apt-get install -y awscli

    - name: Build Docker image
      working-directory: ./backend/
      run: |
        echo "======= NAME is $NAME"

        docker build \
        --tag $ECR:sha-$GITHUB_SHA \
        --tag $ECR:latest .

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1 

    - name: Push Container to Amazon ECR
      run: |
        docker push $ECR:$GITHUB_SHA
        docker push $ECR:latest

    - name: Docker generate SBOM
      uses: cds-snc/security-tools/.github/actions/generate-sbom@34794baf2af592913bb5b51d8df4f8d0acc49b6f # v3.2.0
      env:
        TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
      with:
        docker_image: $ECR:latest
        dockerfile_path: "backend/Dockerfile"
        sbom_name: "gc-signin-dev-backend-api"
        token: "${{ secrets.GITHUB_TOKEN }}"