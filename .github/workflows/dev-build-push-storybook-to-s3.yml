name: DEV Build Push Storybook to S3

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/dev-build-push-storybook-to-s3"
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  GITHUB_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: "dev"

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "latest"

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::329599618423:role/github_action_push_S3
          role-session-name: GHPushAppS3
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Environment Variables
        run: |
          echo "VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}" >> $GITHUB_ENV
          echo "STORYBOOK_FRONTEND_APP_S3_BUCKET=${{ secrets.STORYBOOK_FRONTEND_APP_S3_BUCKET }}" >> $GITHUB_ENV
          echo "STORYBOOK_FRONTEND_APP_CLOUDFRONT_DISTRIBUTION_ID=${{ secrets.STORYBOOK_FRONTEND_APP_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: |
          npm install --legacy-peer-deps
          npm run build-storybook

      - name: Deploy App to S3
        run: |
          aws s3 sync ${{ matrix.module }}/storybook-static s3://${{ secrets.STORYBOOK_FRONTEND_APP_S3_BUCKET }}

      - name: Invalidate STORYBOOK_CLOUDFRONT_DISTRIBUTION cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.STORYBOOK_FRONTEND_APP_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/index.html"
