name: "Frontend Code Coverage"
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"

jobs:
  code-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            artifact: main
          - branch: ${{ github.head_ref }}
            artifact: pull-request
          - module: frontend

    permissions:
      # Required to checkout the code
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Install Deps"
        working-directory: ${{ matrix.module }}
        run: npm install

      - name: "Run Vitest Code Coverage"
        working-directory: ${{ matrix.module }}
        run: npm run test

      - name: "Upload Coverage"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-coverage
          path: ${{ matrix.module }}/coverage/

