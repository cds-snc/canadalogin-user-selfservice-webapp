name: "Frontend Code Coverage"
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"

jobs:
  code-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: frontend

    permissions:
      # Required to checkout the code
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Install Deps"
        working-directory: ${{ matrix.module }}
        run: npm install

      - name: "Run Vitest Code Coverage"
        working-directory: ${{ matrix.module }}
        run: npm run test

      - name: "Upload Coverage"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: ${{ matrix.module }}/coverage

  report-coverage:
      needs: code-coverage
      runs-on: ubuntu-latest
      strategy:
        matrix:
          include:
            - module: frontend
      steps:
        - name: "Download Coverage Artifacts"
          uses: actions/download-artifact@v4
          with:
            name: frontend-coverage-report
            path: coverage
        
        - name: Checkout repository
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

        - name: List files
          run: ls -al ./
        
        - name: Show full path
          run: realpath ./frontend/vitest.config.js

        - name: "Report Coverage"
          uses: davelosert/vitest-coverage-report-action@v2
          with:
            vite-config-path: "./vitest.config.js"
            working-directory: ./frontend
            # json-summary-compare-path: 'coverage-compare-summary.json'
            # json-summary-path: 'coverage-summary-frontend.json'
            # json-final-path: 'coverage-final-frontend.json'