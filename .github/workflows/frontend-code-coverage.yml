name: "Frontend Code Coverage"
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-code-coverage.yml"

jobs:
  vite-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: frontend

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"

      - name: "Install Deps"
        working-directory: ${{ matrix.module }}
        run: npm install

      - name: "Run Vitest Code Coverage"
        working-directory: ${{ matrix.module }}
        run: npm run test

      - name: "Upload Coverage"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage-report
          path: ${{ matrix.module }}

  report-coverage:
    permissions:
      contents: read
      pull-requests: write
    needs: vite-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: frontend
    steps:
      - name: "Download Coverage Artifacts"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: frontend-coverage-report
          path: ${{ matrix.module }}

      - name: "Report Coverage"
        uses: davelosert/vitest-coverage-report-action@7bf7d3c1b17a0e27c7e0d14190fb39168584bed2 # v2.8.1
        with:
          vite-config-path: "./vitest.config.js"
          working-directory: "./${{ matrix.module }}"
