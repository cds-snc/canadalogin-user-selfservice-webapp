name: "Backend Lint"
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"

jobs:
  lint_check_format_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: make install-dev-python

      - name: Lint
        run: make lint-python

      - name: Format Check
        run: make fmt-ci-python

      - name: Test with pytest
        env:
          ROOT_DOMAIN: test.com
          PROFILE_MANAGEMENT_API_URL: test.com
          IBM_VERIFY_TENANT_URL: test.com
          IBM_VERIFY_PROFILE_MANAGEMENT_API_CLIENT_ID: a12345
          IBM_VERIFY_PROFILE_MANAGEMENT_API_SECRET: a123456
          PROFILE_MANAGEMENT_DOMAIN: test.com
          IBM_VERIFY_PROFILE_MANAGEMENT_CLIENT_ID: a123456
          IBM_VERIFY_PROFILE_MANAGEMENT_SECRET: a123456
          SESSION_SECRET: your_secret_key_here
          SESSION_COOKIE_SECURE: False
          SESSION_REDIS_URL: redis://localhost:6379/0
          SESSION_LIFETIME: 90
          REDIS_AUTH_SECRET: "test-secret"
          REDIS_DOMAIN: "master.gc-signin-dev-redis.8pd6gb.cac1.cache.amazonaws.com"
          REDIS_PORT: 6379
        run: make run-pytest

      - name: Build image
        run: make docker-build
