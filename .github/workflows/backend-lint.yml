name: "Backend Lint"
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"  
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"

jobs:
  lint_check_format_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: make install-dev-python

      - name: Lint
        run: make lint-python

      - name: Format Check
        run: make fmt-ci-python
      
      - name: Test with pytest
        env:
          IBM_VERIFY_TENANT_URL: test.com
          IBM_VERIFY_API_CLIENT_ID: a12345
          IBM_VERIFY_API_CLIENT_SECRET: a123456
        run: make run-pytest

      - name: Build image
        run: make docker-build
