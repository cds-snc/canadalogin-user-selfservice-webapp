name: "Backend Code Coverage"
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-code-coverage.yml"
jobs:
  backend-code-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: make install-dev-python

      - name: Test with pytest
        env:
          ROOT_DOMAIN: test.com
          PROFILE_MANAGEMENT_API_URL: test.com
          IBM_VERIFY_TENANT_URL: test.com
          IBM_VERIFY_PROFILE_MANAGEMENT_API_CLIENT_ID: a12345
          IBM_VERIFY_PROFILE_MANAGEMENT_API_SECRET: a123456
          PROFILE_MANAGEMENT_DOMAIN: test.com
          IBM_VERIFY_PROFILE_MANAGEMENT_CLIENT_ID: a123456
          IBM_VERIFY_PROFILE_MANAGEMENT_SECRET: a123456
          SESSION_SECRET: your_secret_key_here
          SESSION_COOKIE_SECURE: False
          SESSION_REDIS_URL: redis://localhost:6379/0
          SESSION_LIFETIME: 90
          REDIS_AUTH_SECRET: "test-secret"
          REDIS_DOMAIN: "master.gc-signin-dev-redis.8pd6gb.cac1.cache.amazonaws.com"
          REDIS_PORT: 6379
        run: make run-pytest
      - name: Check Coverage
        uses: orgoro/coverage@v3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.1
          thresholdNew: 0.1
          thresholdModified: 0.1
