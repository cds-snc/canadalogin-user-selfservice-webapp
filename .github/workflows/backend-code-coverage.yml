name: "Backend Code Coverage"
on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-code-coverage.yml"
jobs:
  backend-code-coverage:
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: make install-dev-python

      - name: Test with pytest
        env:
          IBM_VERIFY_TENANT_URL: test.com
          IBM_VERIFY_API_CLIENT_ID: a12345
          IBM_VERIFY_API_CLIENT_SECRET: a123456
          PROFILE_MANAGEMENT_ORIGIN: test.com
          SESSION_MIDDLEWARE_DOMAIN: test.com
        run: make run-pytest
      - name: Check Coverage
        uses: orgoro/coverage@v3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.1
          thresholdNew: 0.1
          thresholdModified: 0.1
