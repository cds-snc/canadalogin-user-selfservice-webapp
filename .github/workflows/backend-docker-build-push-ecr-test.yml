name: TEST Backend Docker Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build-push-ecr-test.yml"

env: 
  AWS_REGION: ca-central-1
  TAG_NAME: gc-signin-test-backend-api
  ECS_SERVICE: gc-signin-test_ecs_cluster_service
  ECS_CLUSTER: gc-signin-test_ecs_cluster
  ECR: ${{ vars.TEST_AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com/gc-signin-test-backend-api
  GITHUB_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: write
  
jobs:
  docker-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@main
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
        DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}

    - name: Checkout
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

    - name: configure aws credentials using OIDC role
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: arn:aws:iam::${{ vars.TEST_AWS_ACCOUNT_ID }}:role/gc-signin-user-selfservice-webapp-apply
        role-session-name: ECRPush 
        aws-region: ${{ env.AWS_REGION }}

    - name: Build Docker image
      working-directory: ./backend/
      run: |
        docker build \
        --tag $ECR:$GITHUB_SHA \
        --tag $ECR:latest .

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1 

    - name: Push Container to Amazon ECR
      run: |
        docker push $ECR:$GITHUB_SHA
        docker push $ECR:latest

    - name: Docker generate SBOM
      uses: cds-snc/security-tools/.github/actions/generate-sbom@34794baf2af592913bb5b51d8df4f8d0acc49b6f # v3.2.0
      env:
        TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
      with:
        docker_image: "${{ env.ECR }}:latest"
        dockerfile_path: backend/Dockerfile
        sbom_name: ${{ env.TAG_NAME }}
        token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Download ECS task definition
      run: |
          aws ecs describe-task-definition \
            --task-definition ${{env.ECS_SERVICE}} \
            --query taskDefinition > task-definition.json
  
    - name: Update ECS task image
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@5cb8c74c1b1ecaec4c8ea82eff82c009333509ce # v1.8.0
      with:
        task-definition: task-definition.json
        container-name: ${{env.ECS_SERVICE}}
        image: ${{ env.ECR }}:${{ env.GITHUB_SHA }}
  
    - name: Deploy updated ECS task
      uses: aws-actions/amazon-ecs-deploy-task-definition@1beffbdddb3eb5f83c7a746c3e9bafeccdccbbaa # v2.4.0
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        propagate-tags: SERVICE