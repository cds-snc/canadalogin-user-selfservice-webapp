name: "E2E Tests (Playwright)"

# DISABLED: GitHub only runs workflows from .github/workflows/, so this file is inert here.
# To enable, have a repo admin run e2e/ci/setup-e2e-environments.sh, then:
#   git mv e2e/ci/e2e-tests.yml .github/workflows/e2e-tests.yml
#
# Runs the e2e/ suite against a deployed environment (dev by default).
# PR runs exercise the code currently deployed to dev, not the PR's app changes.
on:
  # Validate test changes.
  pull_request:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-tests.yml"
  # Catch regressions after each deployment to dev.
  workflow_run:
    workflows: ["Release pipeline - dev"]
    types: [completed]
    branches: [main]
  # Catch drift in the tenant, access policies or test data.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 02:00/03:00 Eastern
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test

permissions:
  contents: read

# The suite shares test accounts whose IDV state the tests change: never run two
# at once against the same environment.
concurrency:
  group: e2e-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  playwright:
    # - PRs from forks don't get secrets.
    # - Only run after successful dev deployments from main (the release pipeline also
    #   runs on pull requests, where it doesn't deploy).
    if: >-
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dedicated environments (e2e-dev, e2e-test) so PR-triggered jobs can't read
    # deployment secrets.
    environment: e2e-${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: e2e
    env:
      CI: true
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      E2E_PROVEN_USER_EMAIL: ${{ secrets.E2E_PROVEN_USER_EMAIL }}
      E2E_PROVEN_USER_PASSWORD: ${{ secrets.E2E_PROVEN_USER_PASSWORD }}
      E2E_UNPROVEN_USER_EMAIL: ${{ secrets.E2E_UNPROVEN_USER_EMAIL }}
      E2E_UNPROVEN_USER_PASSWORD: ${{ secrets.E2E_UNPROVEN_USER_PASSWORD }}
      E2E_IN_PERSON_USER_EMAIL: ${{ secrets.E2E_IN_PERSON_USER_EMAIL }}
      E2E_IN_PERSON_USER_PASSWORD: ${{ secrets.E2E_IN_PERSON_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # After a deployment, test the commit that was deployed.
          ref: ${{ github.event.workflow_run.head_sha || '' }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-e2e-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      # Traces and videos are disabled in CI (see playwright.config.ts) because
      # artifacts on this public repo are downloadable by any GitHub user.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/junit.xml
          retention-days: 7
