version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://localhost:8000}
      - REACT_APP_IBM_VERIFY_URL=https://gcsignin2.verify.ibm.com/
      - REACT_APP_CLIENT_ID=e70df5ae-b5c4-4831-8371-2edbacd4a12c
      - REACT_APP_REDIRECT_URI=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - IBM_VERIFY_TENANT_URL=https://gcsignin2.verify.ibm.com/
      - IBM_VERIFY_CLIENT_ID=e70df5ae-b5c4-4831-8371-2edbacd4a12c
      - IBM_VERIFY_CLIENT_SECRET=uAVIuisL3e
      - IBM_VERIFY_REDIRECT_URI=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend/app:/app/app
      - ./backend/requirements.txt:/app/requirements.txt
      - ./backend/.env:/app/.env